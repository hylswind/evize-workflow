[pytest]
testpaths = tests
markers =
    aws: runs against a real AWS account (opt-in; needs ENCLAVIZE_AWS_TEST=1 and an allow-listed account). Skipped by default.
    live: reads a real public API (GitHub). No credentials, but needs the network. Skipped by default.
    e2e: end-to-end run of the real workflow via gh (opt-in; destructive). Skipped by default.
