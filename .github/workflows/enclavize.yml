name: enclavize

# A reusable workflow, so every caller is sealed by the same pinned code and one
# verifier covers all of them:
#
#   gh attestation verify statement.json --repo <caller> \
#     --signer-workflow <owner>/enclavize-workflow/.github/workflows/enclavize.yml \
#     --predicate-type https://enclavize.dev/enclaved-account/v1
#
# A caller must grant id-token, attestations and contents, because a reusable
# workflow's permissions are the intersection of its own and the caller's.

on:
  workflow_call:
    inputs:
      domain:
        description: the domain being transferred in (example.com)
        required: true
        type: string
      start:
        description: window start, unix seconds. Must be in the past.
        required: true
        type: string
      repo:
        description: the application repo whose commits this account can apply (owner/name)
        required: true
        type: string
      bypass_event_check:
        description: skip the history audit. Marks the statement debug.
        required: false
        type: boolean
        default: false
      bypass_domain_transfer:
        description: skip accepting the transfer, for an account that already holds the domain. Marks the statement debug.
        required: false
        type: boolean
        default: false
    secrets:
      ROOT_KEY_ID:
        required: true
      ROOT_SECRET:
        required: true
      TRANSFER_PASSWORD:
        required: true
      APPLY_API_KEY:
        required: true
      CONSOLE_ZIP_PASSWORD:
        required: true

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  enclavize:
    runs-on: ubuntu-latest
    # Under the six-hour job ceiling with room for the hold and the audit.
    timeout-minutes: 350
    steps:
      - name: require the credentials password
        # 7z with an empty password writes a readable archive, and that archive
        # becomes a public artifact. Fail before touching the account.
        env:
          ZIP_PASSWORD: ${{ secrets.CONSOLE_ZIP_PASSWORD }}
        run: test -n "$ZIP_PASSWORD"

      - name: work out which enclavize commit is running
        id: self
        # Inside a reusable workflow github.repository is the caller, so the
        # only way to learn enclavize's own repo is job_workflow_ref.
        env:
          SELF_REF: ${{ github.job_workflow_ref }}
        run: echo "repo=${SELF_REF%%/.github/*}" >> "$GITHUB_OUTPUT"

      - name: check out that exact commit
        # Not the caller's tree: the code that seals the account has to be the
        # code the attestation covers.
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ github.job_workflow_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: seal the account
        env:
          ENCLAVIZE_ROOT_KEY: ${{ secrets.ROOT_KEY_ID }}
          ENCLAVIZE_ROOT_SECRET: ${{ secrets.ROOT_SECRET }}
          ENCLAVIZE_TRANSFER_PASSWORD: ${{ secrets.TRANSFER_PASSWORD }}
          ENCLAVIZE_APPLY_API_KEY: ${{ secrets.APPLY_API_KEY }}
          ENCLAVIZE_DOMAIN: ${{ inputs.domain }}
          ENCLAVIZE_START: ${{ inputs.start }}
          ENCLAVIZE_REPO: ${{ inputs.repo }}
          ENCLAVIZE_BYPASS_EVENT_CHECK: ${{ inputs.bypass_event_check }}
          ENCLAVIZE_BYPASS_DOMAIN_TRANSFER: ${{ inputs.bypass_domain_transfer }}
          ENCLAVIZE_SELF_REF: ${{ github.job_workflow_ref }}
          ENCLAVIZE_SELF_SHA: ${{ github.job_workflow_sha }}
          ENCLAVIZE_CALLER_REPO: ${{ github.repository }}
          ENCLAVIZE_GH_TOKEN: ${{ github.token }}
        run: python -u -m workflow

      - name: encrypt the console credentials
        # always(): a run that failed after minting the console user still owes
        # the operator the password.
        if: always()
        env:
          ZIP_PASSWORD: ${{ secrets.CONSOLE_ZIP_PASSWORD }}
        run: |
          test -f console.json || exit 0
          7z a -mhe=on -p"$ZIP_PASSWORD" console.7z console.json
          rm -f console.json

      - name: sign the statement
        id: attest
        uses: actions/attest@v1
        with:
          subject-path: statement.json
          predicate-type: https://enclavize.dev/enclaved-account/v1
          predicate-path: statement.json

      - name: publish the proof into the account
        # After signing, because the bundle exists only once it is signed. The
        # setup program is running in parallel and creates the bucket; this
        # waits for it and warns rather than failing if it never appears.
        run: python -u -m workflow.publish_proof "${{ steps.attest.outputs.bundle-path }}"

      - uses: actions/upload-artifact@v4
        with:
          name: enclavize-statement
          path: statement.json

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('console.7z') != ''
        with:
          name: enclavize-console
          path: console.7z
